defaults:
  range: 5y
  entry_mode: confirm_close
  side: bullish
  include_etfs: true
  etf_groups: core
  top_dollar_volume: 0
  min_last_volume: 50000
  min_avg_volume: 750000
  min_price: 1.0
  min_market_cap: 2000000000

experiments:
  - name: fullgrid
    grid:
      universe: [sp500, us]
      require_confirm_volume: [true, false]
      min_r_multiple: [null, 1.5, 2.0]
      require_fresh_sma_cross_up: [true, false]
      require_rsi_above: [null, 40.0, 50.0]
      require_macd_bullish: [true, false]

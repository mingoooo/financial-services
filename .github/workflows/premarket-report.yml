name: Premarket Report

on:
  push:
    branches:
      - main
      - master
      - ta
    paths:
      - 'scan.py'
      - 'render_report.py'
      - 'REPORT_TEMPLATE.md'
      - 'WATCHLIST_CRITERIA.md'
      - 'prompt_merge.md'
      - 'scripts/build_premarket_report.py'
      - 'scripts/render_market_report_hub.py'
      - 'scripts/render_backtest_overview_html.py'
      - 'scripts/scan_oneil_setups.py'
      - 'scripts/notify_telegram_market_report.py'
      - 'reports/oneil_backtest_overview.html'
      - '.github/workflows/premarket-report.yml'
  workflow_dispatch:
    inputs:
      report_family:
        description: 要生成的报告家族
        required: true
        default: premarket
        type: choice
        options:
          - premarket
          - oneil
          - full
      run_label:
        description: Telegram 文案里的运行标签
        required: false
        default: manual run
        type: string
      deploy_pages:
        description: 若启用 Pages，则部署合并后的报告站点
        required: false
        default: true
        type: boolean
      notify_telegram:
        description: 若启用 Telegram，则按报告家族发送通知
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '00 10 * * *'
    - cron: '00 13 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: premarket-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  market-report:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      run_family: ${{ steps.gate.outputs.run_family }}
      run_label: ${{ steps.gate.outputs.run_label }}
      should_notify: ${{ steps.gate.outputs.should_notify }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decide run family and schedule gate
        id: gate
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os


          def normalize_run_label(label: str) -> str:
              normalized = ' '.join(label.replace('\r', ' ').replace('\n', ' ').split())
              return normalized or 'scheduled run'

          event_name = os.environ.get('GITHUB_EVENT_NAME', '')
          schedule_expr = os.environ.get('GITHUB_EVENT_SCHEDULE', '')
          manual_family = os.environ.get('INPUT_REPORT_FAMILY', '').strip() or 'premarket'
          manual_label = os.environ.get('INPUT_RUN_LABEL', '').strip()
          notify_input = (os.environ.get('INPUT_NOTIFY_TELEGRAM', 'true').strip().lower() == 'true')
          now_ny = datetime.now(ZoneInfo('America/New_York'))
          should_run = True
          run_family = 'premarket'
          run_label = 'scheduled run'

          if event_name == 'schedule':
              scheduled_runs = {
                  '00 10 * * *': ('full', '定时运行 18:00 北京时间'),
                  '00 13 * * *': ('full', '定时运行 21:00 北京时间'),
              }
              scheduled_run = scheduled_runs.get(schedule_expr)
              if scheduled_run is None:
                  should_run = False
                  run_family = 'unknown'
                  run_label = f'unsupported scheduled cron: {schedule_expr or "<empty>"}'
              else:
                  run_family, run_label = scheduled_run
          elif event_name == 'workflow_dispatch':
              run_family = manual_family
              run_label = manual_label or f'manual {run_family}'
          else:
              run_family = 'full'
              run_label = 'push run (full)'

          run_label = normalize_run_label(run_label)
          should_notify = notify_input and run_family in {'premarket', 'oneil', 'full'}

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f"should_run={'true' if should_run else 'false'}\n")
              fh.write(f'run_family={run_family}\n')
              fh.write(f'run_label={run_label}\n')
              fh.write(f"should_notify={'true' if should_notify else 'false'}\n")
              fh.write(f'ny_time={now_ny.isoformat()}\n')
          PY
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          INPUT_REPORT_FAMILY: ${{ github.event.inputs.report_family || '' }}
          INPUT_RUN_LABEL: ${{ github.event.inputs.run_label || '' }}
          INPUT_NOTIFY_TELEGRAM: ${{ github.event.inputs.notify_telegram || 'true' }}

      - name: Skip outside weekday window
        if: github.event_name == 'schedule' && steps.gate.outputs.should_run != 'true'
        run: |
          echo "Skipping scheduled run outside weekday NY window."
          echo "NY time was: ${{ steps.gate.outputs.ny_time }}"

      - name: Install dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install markdown yfinance feedparser requests pandas jinja2 beautifulsoup4 matplotlib

      - name: Prepare report directories
        if: steps.gate.outputs.should_run == 'true'
        run: mkdir -p reports/site reports/oneil-live reports/minervini-live

      - name: Run premarket scan
        if: steps.gate.outputs.should_run == 'true' && (steps.gate.outputs.run_family == 'premarket' || steps.gate.outputs.run_family == 'full')
        run: python scan.py

      - name: Build premarket markdown report
        if: steps.gate.outputs.should_run == 'true' && (steps.gate.outputs.run_family == 'premarket' || steps.gate.outputs.run_family == 'full')
        run: python scripts/build_premarket_report.py packet.json REPORT.md

      - name: Render premarket HTML report
        if: steps.gate.outputs.should_run == 'true' && (steps.gate.outputs.run_family == 'premarket' || steps.gate.outputs.run_family == 'full')
        shell: bash
        run: |
          python render_report.py REPORT.md $(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo('America/New_York')).strftime('%Y-%m-%d'))
          PY
          )

      - name: Hydrate missing published pages
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        env:
          PUBLISHED_SITE_BASE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          mkdir -p reports/oneil-live reports/minervini-live

          fetch_if_missing() {
            local dest="$1"
            local url="$2"
            if [ -f "$dest" ]; then
              return 0
            fi
            mkdir -p "$(dirname "$dest")"
            if curl --fail --silent --show-error --location "$url" --output "$dest"; then
              echo "Hydrated $dest from $url"
            else
              rm -f "$dest"
              echo "Skip hydrate for $dest (source unavailable: $url)"
            fi
          }

          fetch_if_missing reports/premarket_.html "${PUBLISHED_SITE_BASE%/}/premarket_.html"
          fetch_if_missing reports/premarket_zh.html "${PUBLISHED_SITE_BASE%/}/premarket_zh.html"
          fetch_if_missing reports/oneil-live/live-full-latest.html "${PUBLISHED_SITE_BASE%/}/oneil-live/live-full-latest.html"
          fetch_if_missing reports/oneil-live/live-full-latest.json "${PUBLISHED_SITE_BASE%/}/oneil-live/live-full-latest.json"
          fetch_if_missing reports/minervini-live/live-full-latest.html "${PUBLISHED_SITE_BASE%/}/minervini-live/live-full-latest.html"
          fetch_if_missing reports/minervini-live/live-full-latest.json "${PUBLISHED_SITE_BASE%/}/minervini-live/live-full-latest.json"
          fetch_if_missing reports/oneil_backtest_overview.html "${PUBLISHED_SITE_BASE%/}/oneil_backtest_overview.html"

      - name: Run O'Neil chain
        if: steps.gate.outputs.should_run == 'true' && (steps.gate.outputs.run_family == 'oneil' || steps.gate.outputs.run_family == 'full')
        run: |
          python scripts/scan_oneil_setups.py \
            --universe all-us \
            --limit 0 \
            --include-news \
            --include-earnings \
            --report-name live-full-latest \
            --out-dir reports/oneil-live

      - name: Run Minervini chain
        if: steps.gate.outputs.should_run == 'true' && (steps.gate.outputs.run_family == 'oneil' || steps.gate.outputs.run_family == 'full')
        run: |
          python scripts/scan_oneil_setups.py \
            --universe all-us \
            --limit 0 \
            --strategy-profile minervini_strict \
            --report-name live-full-latest \
            --out-dir reports/minervini-live

      - name: Render merged market report hub
        if: steps.gate.outputs.should_run == 'true'
        run: python scripts/render_market_report_hub.py --output-dir reports/site

      - name: Prepare artifact bundle
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          copy_if_exists() {
            src="$1"
            dest="$2"
            if [ -e "$src" ]; then
              mkdir -p "$(dirname "$dest")"
              cp "$src" "$dest"
            fi
          }

          rm -rf market-report-bundle
          mkdir -p market-report-bundle/reports/oneil-live market-report-bundle/reports/minervini-live
          copy_if_exists reports/premarket_.html market-report-bundle/reports/premarket_.html
          copy_if_exists reports/premarket_zh.html market-report-bundle/reports/premarket_zh.html
          copy_if_exists reports/oneil-live/live-full-latest.html market-report-bundle/reports/oneil-live/live-full-latest.html
          copy_if_exists reports/oneil-live/live-full-latest.json market-report-bundle/reports/oneil-live/live-full-latest.json
          copy_if_exists reports/minervini-live/live-full-latest.html market-report-bundle/reports/minervini-live/live-full-latest.html
          copy_if_exists reports/minervini-live/live-full-latest.json market-report-bundle/reports/minervini-live/live-full-latest.json
          copy_if_exists reports/oneil_backtest_overview.html market-report-bundle/reports/oneil_backtest_overview.html
          copy_if_exists REPORT.md market-report-bundle/REPORT.md
          copy_if_exists packet.json market-report-bundle/packet.json

          if [ -d reports/site ]; then
            mkdir -p market-report-bundle/reports/site
            cp -R reports/site/. market-report-bundle/reports/site/
          fi

      - name: Upload report artifact
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: market-report-site
          path: market-report-bundle
          if-no-files-found: error

  deploy-pages:
    if: ${{ needs.market-report.outputs.should_run == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.deploy_pages == 'true') }}
    needs: market-report
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Download report artifact
        uses: actions/download-artifact@v4
        with:
          name: market-report-site
          path: market-report-bundle

      - name: Prepare Pages payload
        shell: bash
        run: |
          copy_if_exists() {
            src="$1"
            dest="$2"
            if [ -e "$src" ]; then
              mkdir -p "$(dirname "$dest")"
              cp "$src" "$dest"
            fi
          }

          rm -rf pages_payload
          mkdir -p pages_payload pages_payload/reports
          cp -R market-report-bundle/reports/site/. pages_payload/
          cp -R market-report-bundle/reports/. pages_payload/reports/

          # Keep a second copy of source reports at the paths expected by the
          # generated wrapper pages. The wrappers are rendered under
          # reports/site/* locally, then promoted to Pages root during deploy.
          # Without these root-level copies, links like ../../premarket_zh.html
          # resolve to 404 after deployment.
          copy_if_exists market-report-bundle/reports/premarket_.html pages_payload/premarket_.html
          copy_if_exists market-report-bundle/reports/premarket_zh.html pages_payload/premarket_zh.html
          copy_if_exists market-report-bundle/reports/oneil-live/live-full-latest.html pages_payload/oneil-live/live-full-latest.html
          copy_if_exists market-report-bundle/reports/oneil-live/live-full-latest.json pages_payload/oneil-live/live-full-latest.json
          copy_if_exists market-report-bundle/reports/minervini-live/live-full-latest.html pages_payload/minervini-live/live-full-latest.html
          copy_if_exists market-report-bundle/reports/minervini-live/live-full-latest.json pages_payload/minervini-live/live-full-latest.json
          copy_if_exists market-report-bundle/reports/oneil_backtest_overview.html pages_payload/oneil_backtest_overview.html

          touch pages_payload/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages_payload

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Write Pages summary
        if: steps.deployment.outputs.page_url != ''
        shell: bash
        run: |
          BASE_URL="${{ steps.deployment.outputs.page_url }}"
          {
            echo "## GitHub Pages"
            echo
            echo "- Hub: ${BASE_URL%/}/"
            if [ -f pages_payload/premarket/index.html ]; then
              echo "- Premarket 中文: ${BASE_URL%/}/premarket/index.html"
            fi
            if [ -f pages_payload/premarket/index_en.html ]; then
              echo "- Premarket English: ${BASE_URL%/}/premarket/index_en.html"
            fi
            if [ -f pages_payload/oneil/index.html ]; then
              echo "- O'Neil: ${BASE_URL%/}/oneil/index.html"
            fi
            if [ -f pages_payload/minervini/index.html ]; then
              echo "- Minervini: ${BASE_URL%/}/minervini/index.html"
            fi
            if [ -f pages_payload/oneil-backtest/index.html ]; then
              echo "- O'Neil Backtest: ${BASE_URL%/}/oneil-backtest/index.html"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  notify-telegram:
    needs:
      - market-report
      - deploy-pages
    runs-on: ubuntu-latest
    if: ${{ always() && needs.market-report.outputs.should_run == 'true' && needs.market-report.outputs.should_notify == 'true' && (needs.deploy-pages.result == 'success' || needs.deploy-pages.result == 'skipped') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download report artifact
        uses: actions/download-artifact@v4
        with:
          name: market-report-site
          path: market-report-bundle

      - name: Send Telegram notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          BASE_URL="${{ needs.deploy-pages.outputs.page_url || '' }}"
          RUN_LABEL="${{ needs.market-report.outputs.run_label }}"
          FAMILY="${{ needs.market-report.outputs.run_family }}"
          REPORT_URL=""
          HUB_URL=""
          PREMARKET_URL=""
          PREMARKET_EN_URL=""
          ONEIL_URL=""

          if [ -n "$BASE_URL" ]; then
            HUB_URL="${BASE_URL%/}/"
            PREMARKET_URL="${BASE_URL%/}/premarket/index.html"
            PREMARKET_EN_URL="${BASE_URL%/}/premarket/index_en.html"
            ONEIL_URL="${BASE_URL%/}/oneil/index.html"
            case "$FAMILY" in
              premarket) REPORT_URL="$PREMARKET_URL" ;;
              oneil) REPORT_URL="$ONEIL_URL" ;;
              full) REPORT_URL="$HUB_URL" ;;
            esac
          fi

          case "$FAMILY" in
            premarket)
              python scripts/notify_telegram_market_report.py \
                --family premarket \
                --report-path market-report-bundle/REPORT.md \
                --hub-url "$HUB_URL" \
                --pages-url "$REPORT_URL" \
                --alt-pages-url "$PREMARKET_EN_URL" \
                --run-label "$RUN_LABEL"
              ;;
            oneil)
              python scripts/notify_telegram_market_report.py \
                --family oneil \
                --report-path market-report-bundle/reports/oneil-live/live-full-latest.json \
                --hub-url "$HUB_URL" \
                --pages-url "$REPORT_URL" \
                --run-label "$RUN_LABEL"
              ;;
            full)
              python scripts/notify_telegram_market_report.py \
                --family full \
                --premarket-report-path market-report-bundle/REPORT.md \
                --oneil-report-path market-report-bundle/reports/oneil-live/live-full-latest.json \
                --hub-url "$HUB_URL" \
                --premarket-pages-url "$PREMARKET_URL" \
                --premarket-alt-pages-url "$PREMARKET_EN_URL" \
                --oneil-pages-url "$ONEIL_URL" \
                --run-label "$RUN_LABEL"
              ;;
            *)
              echo "Skipping Telegram notification for family: $FAMILY"
              ;;
          esac

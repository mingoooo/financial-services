name: Premarket Report

on:
  push:
    branches:
      - main
      - master
      - ta
    paths:
      - 'scan.py'
      - 'render_report.py'
      - 'REPORT_TEMPLATE.md'
      - 'WATCHLIST_CRITERIA.md'
      - 'prompt_merge.md'
      - 'scripts/notify_telegram_premarket.py'
      - '.github/workflows/premarket-report.yml'
  workflow_dispatch:
    inputs:
      run_label:
        description: Telegram 文案里的运行标签
        required: false
        default: manual run
        type: string
      deploy_pages:
        description: 若启用 Pages，则部署 HTML 报告
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '30 10 * * 1-5'
    - cron: '30 12 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: premarket-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  premarket:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      should_run: ${{ steps.gate.outputs.should_run }}
      run_label: ${{ steps.gate.outputs.run_label }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decide whether to run now
        id: gate
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os

          now_ny = datetime.now(ZoneInfo("America/New_York"))
          weekday = now_ny.weekday()
          should_run = weekday < 5
          run_label = "manual run"
          event_name = os.environ.get("GITHUB_EVENT_NAME", "")
          if event_name == "schedule":
              hhmm = now_ny.strftime("%H:%M")
              if hhmm == "06:30":
                  run_label = "开盘前 3 小时"
              elif hhmm == "08:30":
                  run_label = "开盘前 1 小时"
              else:
                  run_label = f"scheduled {hhmm} ET"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"should_run={'true' if should_run else 'false'}\n")
              fh.write(f"ny_time={now_ny.isoformat()}\n")
              fh.write(f"run_label={run_label}\n")
          PY
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Skip outside weekday window
        if: github.event_name == 'schedule' && steps.gate.outputs.should_run != 'true'
        run: |
          echo "Skipping scheduled run outside weekday NY window."
          echo "NY time was: ${{ steps.gate.outputs.ny_time }}"

      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.gate.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install markdown yfinance feedparser requests

      - name: Prepare report directory
        if: github.event_name != 'schedule' || steps.gate.outputs.should_run == 'true'
        run: mkdir -p reports/site

      - name: Run premarket scan
        if: github.event_name != 'schedule' || steps.gate.outputs.should_run == 'true'
        run: python scan.py

      - name: Build markdown report
        if: github.event_name != 'schedule' || steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          python scripts/build_premarket_report.py packet.json REPORT.md

      - name: Render HTML report
        if: github.event_name != 'schedule' || steps.gate.outputs.should_run == 'true'
        run: |
          python render_report.py REPORT.md $(python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          print(datetime.now(ZoneInfo('America/New_York')).strftime('%Y-%m-%d'))
          PY
          )
          cp reports/premarket_zh.html reports/site/index.html
          cp reports/premarket_.html reports/site/index_en.html
          cp reports/premarket_zh.html reports/site/index_zh.html

      - name: Upload reports artifact
        if: github.event_name != 'schedule' || steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: premarket-report
          path: |
            packet.json
            REPORT.md
            reports/premarket_.html
            reports/premarket_zh.html
            reports/site/index.html
            reports/site/index_zh.html
          if-no-files-found: error

  deploy-pages:
    if: ${{ needs.premarket.outputs.should_run == 'true' && (github.event_name != 'workflow_dispatch' || github.event.inputs.deploy_pages == 'true') }}
    needs: premarket
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Download report artifact
        uses: actions/download-artifact@v4
        with:
          name: premarket-report
          path: premarket-report

      - name: Prepare Pages payload
        run: |
          rm -rf pages_payload
          mkdir -p pages_payload
          cp premarket-report/reports/site/index.html pages_payload/index.html
          cp premarket-report/reports/site/index_zh.html pages_payload/index_zh.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages_payload

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify-telegram:
    needs:
      - premarket
      - deploy-pages
    runs-on: ubuntu-latest
    if: ${{ always() && needs.premarket.outputs.should_run == 'true' && (needs.deploy-pages.result == 'success' || needs.deploy-pages.result == 'skipped') }}
    steps:
      - name: Download report artifact
        uses: actions/download-artifact@v4
        with:
          name: premarket-report
          path: premarket-report

      - name: Send Telegram notification
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PAGES_URL="${{ needs.deploy-pages.outputs.page_url || '' }}"
          RUN_LABEL="${{ github.event.inputs.run_label || needs.premarket.outputs.run_label }}"
          python scripts/notify_telegram_premarket.py premarket-report/REPORT.md "$PAGES_URL" "$RUN_LABEL"

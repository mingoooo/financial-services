name: Scan Reversals

on:
  workflow_dispatch:
    inputs:
      side:
        description: Scan side
        required: false
        default: both
        type: choice
        options:
          - both
          - bullish
          - bearish
      universe:
        description: Scan universe
        required: false
        default: us
        type: choice
        options:
          - us
          - sp500
          - liquid
      include_etfs:
        description: Include ETFs
        required: false
        default: true
        type: boolean
      min_market_cap:
        description: Minimum market cap
        required: false
        default: '2000000000'
        type: string
      min_price:
        description: Minimum price
        required: false
        default: '1'
        type: string
      min_avg_volume:
        description: Minimum average volume
        required: false
        default: '750000'
        type: string
      min_last_volume:
        description: Minimum last-day volume
        required: false
        default: '50000'
        type: string
      recent_confirm_days:
        description: Keep signals confirmed within N days
        required: false
        default: '2'
        type: string
      workers:
        description: Concurrent workers
        required: false
        default: '8'
        type: string
      scan_retries:
        description: Per-symbol retry attempts
        required: false
        default: '3'
        type: string
      require_confirm_volume:
        description: Require confirmation-day volume above average
        required: false
        default: true
        type: boolean
      no_cache:
        description: Disable local cache during run
        required: false
        default: true
        type: boolean
      deploy_pages:
        description: Deploy to GitHub Pages if Pages is enabled
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '15 22 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decide whether to run now
        id: gate
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os

          now_ny = datetime.now(ZoneInfo("America/New_York"))
          hour = now_ny.hour
          minute = now_ny.minute
          weekday = now_ny.weekday()
          should_run = weekday < 5 and ((hour == 17 and minute >= 5) or hour > 17)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"should_run={'true' if should_run else 'false'}\n")
              fh.write(f"ny_time={now_ny.isoformat()}\n")
          PY

      - name: Skip outside target window
        if: github.event_name == 'schedule' && steps.gate.outputs.should_run != 'true'
        run: |
          echo "Skipping scheduled run outside post-close NY window."
          echo "NY time was: ${{ steps.gate.outputs.ny_time }}"

      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.gate.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install finvizfinance

      - name: Prepare report directory
        if: github.event_name != 'schedule' || steps.gate.outputs.should_run == 'true'
        run: mkdir -p reports/site

      - name: Run reversal scan
        if: github.event_name != 'schedule' || steps.gate.outputs.should_run == 'true'
        run: |
          SIDE="${{ github.event.inputs.side || 'both' }}"
          UNIVERSE="${{ github.event.inputs.universe || 'us' }}"
          MIN_MARKET_CAP="${{ github.event.inputs.min_market_cap || '2000000000' }}"
          MIN_PRICE="${{ github.event.inputs.min_price || '1' }}"
          MIN_AVG_VOLUME="${{ github.event.inputs.min_avg_volume || '750000' }}"
          MIN_LAST_VOLUME="${{ github.event.inputs.min_last_volume || '50000' }}"
          RECENT_CONFIRM_DAYS="${{ github.event.inputs.recent_confirm_days || '2' }}"
          WORKERS="${{ github.event.inputs.workers || '8' }}"
          SCAN_RETRIES="${{ github.event.inputs.scan_retries || '3' }}"

          ETF_FLAG="--include-etfs"
          if [ "${{ github.event.inputs.include_etfs || 'true' }}" != "true" ]; then
            ETF_FLAG="--exclude-etfs"
          fi

          CONFIRM_VOLUME_FLAG="--require-confirm-volume"
          if [ "${{ github.event.inputs.require_confirm_volume || 'true' }}" != "true" ]; then
            CONFIRM_VOLUME_FLAG="--no-require-confirm-volume"
          fi

          CACHE_FLAG="--no-cache"
          if [ "${{ github.event.inputs.no_cache || 'true' }}" != "true" ]; then
            CACHE_FLAG=""
          fi

          python scripts/scan_reversals.py \
            --universe "$UNIVERSE" \
            --side "$SIDE" \
            $ETF_FLAG \
            --min-market-cap "$MIN_MARKET_CAP" \
            --min-price "$MIN_PRICE" \
            --min-avg-volume "$MIN_AVG_VOLUME" \
            --min-last-volume "$MIN_LAST_VOLUME" \
            --recent-confirm-days "$RECENT_CONFIRM_DAYS" \
            --workers "$WORKERS" \
            --scan-retries "$SCAN_RETRIES" \
            $CONFIRM_VOLUME_FLAG \
            $CACHE_FLAG \
            --html reports/site/index.html \
            --json reports/reversal_signals.json

      - name: Upload reports artifact
        if: github.event_name != 'schedule' || steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reversal-scan-reports
          path: |
            reports/site/index.html
            reports/reversal_signals.json
          if-no-files-found: error

      - name: Configure Pages
        if: (github.event_name != 'schedule' || steps.gate.outputs.should_run == 'true') && github.event.inputs.deploy_pages == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: (github.event_name != 'schedule' || steps.gate.outputs.should_run == 'true') && github.event.inputs.deploy_pages == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/site

      - name: Deploy to GitHub Pages
        if: (github.event_name != 'schedule' || steps.gate.outputs.should_run == 'true') && github.event.inputs.deploy_pages == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

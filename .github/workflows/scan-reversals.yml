name: Scan Reversals

on:
  push:
    branches:
      - main
      - master
      - ta
    paths:
      - 'scripts/scan_reversals.py'
      - 'scripts/backtest_reversals.py'
      - 'scripts/reversal_lib/**'
      - 'scripts/etf_universe.json'
      - '.github/workflows/scan-reversals.yml'
  workflow_dispatch:
    inputs:
      preset:
        description: 策略预设
        required: false
        default: main
        type: choice
        options:
          - main
          - high_quality
      recent_confirm_days:
        description: 仅保留最近 N 天确认信号
        required: false
        default: '2'
        type: string
      workers:
        description: 并发 worker 数
        required: false
        default: '8'
        type: string
      scan_retries:
        description: 单股票重试次数
        required: false
        default: '3'
        type: string
      no_cache:
        description: 禁用本地缓存
        required: false
        default: true
        type: boolean
      deploy_pages:
        description: 若启用 Pages，则部署 HTML 报告
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '15 22 * * 1-5'

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Decide whether to run now
        id: gate
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os

          now_ny = datetime.now(ZoneInfo("America/New_York"))
          hour = now_ny.hour
          minute = now_ny.minute
          weekday = now_ny.weekday()
          should_run = weekday < 5 and ((hour == 17 and minute >= 5) or hour > 17)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"should_run={'true' if should_run else 'false'}\n")
              fh.write(f"ny_time={now_ny.isoformat()}\n")
          PY

      - name: Skip outside target window
        if: github.event_name == 'schedule' && steps.gate.outputs.should_run != 'true'
        run: |
          echo "Skipping scheduled run outside post-close NY window."
          echo "NY time was: ${{ steps.gate.outputs.ny_time }}"

      - name: Install dependencies
        if: github.event_name != 'schedule' || steps.gate.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install finvizfinance yfinance

      - name: Prepare report directory
        if: github.event_name != 'schedule' || steps.gate.outputs.should_run == 'true'
        run: mkdir -p reports/site

      - name: Run reversal scan
        if: github.event_name != 'schedule' || steps.gate.outputs.should_run == 'true'
        run: |
          PRESET="${{ github.event.inputs.preset || 'main' }}"
          RECENT_CONFIRM_DAYS="${{ github.event.inputs.recent_confirm_days || '2' }}"
          WORKERS="${{ github.event.inputs.workers || '8' }}"
          SCAN_RETRIES="${{ github.event.inputs.scan_retries || '3' }}"

          CACHE_FLAG="--no-cache"
          if [ "${{ github.event.inputs.no_cache || 'true' }}" != "true" ]; then
            CACHE_FLAG=""
          fi

          python scripts/scan_reversals.py \
            --preset "$PRESET" \
            --recent-confirm-days "$RECENT_CONFIRM_DAYS" \
            --workers "$WORKERS" \
            --scan-retries "$SCAN_RETRIES" \
            $CACHE_FLAG \
            --html reports/site/index.html \
            --json reports/reversal_signals.json

      - name: Upload reports artifact
        if: github.event_name != 'schedule' || steps.gate.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reversal-scan-reports
          path: |
            reports/site/index.html
            reports/reversal_signals.json
          if-no-files-found: error

      - name: Configure Pages
        if: (github.event_name != 'schedule' || steps.gate.outputs.should_run == 'true') && (github.event_name != 'workflow_dispatch' || github.event.inputs.deploy_pages == 'true')
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: (github.event_name != 'schedule' || steps.gate.outputs.should_run == 'true') && (github.event_name != 'workflow_dispatch' || github.event.inputs.deploy_pages == 'true')
        uses: actions/upload-pages-artifact@v3
        with:
          path: reports/site

      - name: Deploy to GitHub Pages
        if: (github.event_name != 'schedule' || steps.gate.outputs.should_run == 'true') && (github.event_name != 'workflow_dispatch' || github.event.inputs.deploy_pages == 'true')
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send Telegram notification
        if: github.event_name != 'schedule' || steps.gate.outputs.should_run == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PAGES_URL=""
          if [ -n "${{ steps.deployment.outputs.page_url }}" ]; then
            PAGES_URL="${{ steps.deployment.outputs.page_url }}"
          fi
          python scripts/notify_telegram_scan.py reports/reversal_signals.json "$PAGES_URL"
